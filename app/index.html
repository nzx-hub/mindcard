<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MindCard 忆卡：本地优先、卡组可交换的间隔重复记忆卡">
<title>MindCard · 忆卡</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M18 20h12c4 0 6 2 6 6v20c0-3-2-5-5-5H18z' fill='%23fff' opacity='.92'/%3E%3Cpath d='M46 20H34c-4 0-6 2-6 6v20c0-3 2-5 5-5h13z' fill='%23fff' opacity='.65'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/today">
      <span class="mark">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path>
          <path d="M9 7h6M9 10.5h4"></path>
        </svg>
      </span>
      <span class="txt"><b>MindCard · 忆卡</b><span>通用记忆卡 · 间隔重复</span></span>
    </a>
    <nav class="nav">
      <a href="#/today" data-route="today">今日</a>
      <a href="#/decks" data-route="decks">卡组</a>
      <a href="#/library" data-route="library">卡库</a>
      <a href="#/stats" data-route="stats">统计</a>
    </nav>
    <button class="icon-btn" id="themeBtn" title="切换深色 / 浅色" aria-label="切换主题">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"></circle>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"></path>
      </svg>
    </button>
    <a class="icon-btn" href="#/settings" title="设置" aria-label="设置">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
      </svg>
    </a>
  </div>
</header>

<main class="shell" id="view">
  <div class="empty">正在加载…</div>
</main>

<footer>
  MindCard · 本地优先的间隔重复记忆卡 · 浏览器用 localStorage，桌面版写入本机数据目录<br>
  卡组格式与工具见 GitHub 仓库 · 建议定期在「设置」中导出备份
</footer>

<div class="toast" id="toast"></div>

<noscript><div class="shell"><p class="panel">需要启用 JavaScript 才能使用本软件。</p></div></noscript>

<!-- 内置卡组由 tools/build_app_decks.py 生成 -->
<script src="storage.js"></script>
<script src="decks.js"></script>
<script src="deck-store.js"></script>
<script src="app.js"></script>
</body>
</html>
