<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MindCard 忆卡：本地优先、卡组可交换的间隔重复记忆卡">
<title>MindCard · 忆卡</title>
<style>
:root {
  --bg: #f4f1ea;
  --bg-soft: #ebe6db;
  --panel: #fffdf8;
  --panel-2: #faf7ef;
  --ink: #1d2733;
  --ink-2: #46525f;
  --muted: #7b8593;
  --line: #e4ded1;
  --line-strong: #d3cbba;
  --accent: #0f766e;
  --accent-soft: #d9efe9;
  --accent-ink: #0b5a54;
  --gold: #b45309;
  --gold-soft: #fbeedb;
  --rose: #b91c1c;
  --rose-soft: #fbe4e4;
  --blue: #1d4ed8;
  --blue-soft: #e3e9fb;
  --shadow: 0 18px 40px -24px rgba(29, 39, 51, 0.35);
  --shadow-sm: 0 6px 18px -12px rgba(29, 39, 51, 0.4);
  --radius: 22px;
  --radius-sm: 14px;
  --font: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
}

[data-theme="dark"] {
  --bg: #12161b;
  --bg-soft: #171d24;
  --panel: #1a2129;
  --panel-2: #202832;
  --ink: #e8edf3;
  --ink-2: #bac4cf;
  --muted: #8b97a5;
  --line: #2a333e;
  --line-strong: #3a4552;
  --accent: #2dd4bf;
  --accent-soft: #123b38;
  --accent-ink: #7de8da;
  --gold: #fbbf24;
  --gold-soft: #3a2c12;
  --rose: #f87171;
  --rose-soft: #3d1b1b;
  --blue: #93b4ff;
  --blue-soft: #1c2a4a;
  --shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.8);
  --shadow-sm: 0 6px 18px -12px rgba(0, 0, 0, 0.7);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font);
  background:
    radial-gradient(1100px 600px at 12% -10%, rgba(15, 118, 110, 0.09), transparent 60%),
    radial-gradient(900px 500px at 92% 0%, rgba(180, 83, 9, 0.07), transparent 55%),
    var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  line-height: 1.65;
}

[data-theme="dark"] body {
  background:
    radial-gradient(1100px 600px at 12% -10%, rgba(45, 212, 191, 0.07), transparent 60%),
    radial-gradient(900px 500px at 92% 0%, rgba(251, 191, 36, 0.05), transparent 55%),
    var(--bg);
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
::selection { background: var(--accent-soft); }

.shell { max-width: 1160px; margin: 0 auto; padding: 0 22px 70px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: blur(14px);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
}
.topbar-in {
  max-width: 1160px; margin: 0 auto; padding: 12px 22px;
  display: flex; align-items: center; gap: 18px;
}
.brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: 0.2px; }
.brand .mark {
  width: 38px; height: 38px; border-radius: 12px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, var(--accent), #0b5a54);
  color: #fff; box-shadow: 0 8px 18px -10px rgba(15, 118, 110, 0.9);
}
[data-theme="dark"] .brand .mark { color: #08312d; background: linear-gradient(145deg, #5eead4, #2dd4bf); }
.brand .txt { display: flex; flex-direction: column; line-height: 1.2; }
.brand .txt b { font-size: 15.5px; }
.brand .txt span { font-size: 11px; color: var(--muted); letter-spacing: 0.8px; }

.nav { display: flex; gap: 4px; margin-left: auto; padding: 4px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); }
.nav a {
  padding: 7px 15px; border-radius: 999px; font-size: 14px; color: var(--ink-2);
  transition: 0.18s ease; white-space: nowrap;
}
.nav a:hover { color: var(--ink); }
.nav a.on { background: var(--panel); color: var(--accent-ink); box-shadow: var(--shadow-sm); font-weight: 600; }

.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink-2); display: grid; place-items: center;
  transition: 0.18s ease;
}
.icon-btn:hover { color: var(--accent); border-color: var(--line-strong); transform: translateY(-1px); }

/* ---------- common ---------- */
.eyebrow { font-size: 12.5px; letter-spacing: 2.4px; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
h1, h2, h3 { line-height: 1.3; margin: 0; }
h1 { font-size: clamp(26px, 3.4vw, 40px); letter-spacing: -0.5px; }
h2 { font-size: 20px; }
h3 { font-size: 16px; }
p { margin: 0; }
.lead { color: var(--ink-2); font-size: 15px; }
.muted { color: var(--muted); }
.tiny { font-size: 12.5px; }

.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 22px;
  box-shadow: var(--shadow-sm);
}
.panel-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.panel-head h2 { font-size: 17px; }
.panel-head .muted { margin-left: auto; font-size: 12.5px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; border-radius: 13px;
  padding: 11px 20px; font-size: 14.5px; font-weight: 600;
  background: var(--accent); color: #fff; transition: 0.18s ease;
  box-shadow: 0 12px 24px -14px rgba(15, 118, 110, 0.9);
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
.btn:active { transform: translateY(0); }
[data-theme="dark"] .btn { color: #052e2a; }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line-strong); box-shadow: none; }
.btn.ghost:hover { color: var(--accent); border-color: var(--accent); }
.btn.soft { background: var(--accent-soft); color: var(--accent-ink); box-shadow: none; }
.btn.sm { padding: 8px 14px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line);
  font-size: 11.5px; color: var(--ink-2); white-space: nowrap;
}
.chip.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.chip.gold { background: var(--gold-soft); border-color: transparent; color: var(--gold); }

.bar { height: 7px; border-radius: 99px; background: var(--bg-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #14b8a6); transition: width 0.6s cubic-bezier(.2,.8,.2,1); }

/* ---------- hero ---------- */
.hero {
  margin-top: 26px; padding: 34px; border-radius: 28px;
  background:
    radial-gradient(600px 300px at 88% 10%, rgba(20, 184, 166, 0.18), transparent 60%),
    radial-gradient(500px 260px at 4% 96%, rgba(180, 83, 9, 0.13), transparent 60%),
    linear-gradient(140deg, var(--panel), var(--panel-2));
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 30px; align-items: center;
  position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle at 1px 1px, rgba(29,39,51,0.06) 1px, transparent 0);
  background-size: 18px 18px; opacity: 0.5;
  mask-image: linear-gradient(120deg, transparent 30%, #000);
}
[data-theme="dark"] .hero::after { background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.06) 1px, transparent 0); }
.hero > * { position: relative; z-index: 1; }
.hero h1 em { font-style: normal; color: var(--accent); font-variant-numeric: tabular-nums; }
.hero .lead { margin-top: 10px; }
.hero-actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.hero-side { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.ring {
  --p: 0;
  width: 148px; height: 148px; border-radius: 50%;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--bg-soft) 0);
  display: grid; place-items: center; position: relative;
}
.ring::before { content: ""; position: absolute; inset: 11px; border-radius: 50%; background: var(--panel); }
.ring .val { position: relative; text-align: center; line-height: 1.2; }
.ring .val b { display: block; font-size: 30px; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.ring .val span { font-size: 11.5px; color: var(--muted); }
.hero-side .caption { font-size: 12px; color: var(--muted); }

/* ---------- stats ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
.stat {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  padding: 16px 18px; display: flex; flex-direction: column; gap: 2px;
}
.stat .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stat .v { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.stat.warm .v { color: var(--gold); }
.stat.cool .v { color: var(--accent); }

/* ---------- dashboard layout ---------- */
.cols { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 16px; margin-top: 16px; }
.cols.even { grid-template-columns: 1fr 1fr; }

.forecast { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding-top: 6px; }
.forecast .day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.forecast .col { width: 100%; max-width: 40px; border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg, #14b8a6, var(--accent)); min-height: 4px; transition: height .5s ease; position: relative; }
.forecast .col.zero { background: var(--bg-soft); }
.forecast .n { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.forecast .d { font-size: 11px; color: var(--muted); }
.forecast .d.today { color: var(--accent); font-weight: 700; }

.curve-wrap { position: relative; }
.curve-wrap svg { width: 100%; height: 150px; display: block; overflow: visible; }
.ladder { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.ladder span { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.ladder span.on { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }

.chapters { display: flex; flex-direction: column; gap: 2px; }
.chrow { display: grid; grid-template-columns: 30px minmax(0,1fr) 92px 46px; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px dashed var(--line); }
.chrow:last-child { border-bottom: 0; }
.chrow .idx { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chrow .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chrow .pct { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.chrow:hover .name { color: var(--accent); }

/* ---------- study ---------- */
.study { max-width: 800px; margin: 26px auto 0; }
.study-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.study-tools { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
.study-tools .quit { white-space: nowrap; }
.study-head .bar { flex: 1; height: 6px; }
.counter { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.quit { border: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 4px 6px; border-radius: 8px; }
.quit:hover { color: var(--rose); background: var(--rose-soft); }

.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 26px;
  padding: 30px 32px 24px; box-shadow: var(--shadow);
  min-height: 430px; display: flex; flex-direction: column;
  animation: cardIn 0.35s cubic-bezier(.2,.8,.2,1);
}
@keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(0.995); } to { opacity: 1; transform: none; } }
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.card-top .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.q { font-size: clamp(18px, 2.2vw, 22px); font-weight: 650; line-height: 1.6; letter-spacing: -0.2px; }
.q .blank { color: var(--accent); }
pre.code, .card pre, .panel pre {
  font-family: var(--mono); font-size: 13.5px; line-height: 1.72;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; overflow-x: auto; margin: 16px 0 0;
  color: var(--ink-2);
}
.answer {
  margin-top: 18px; padding: 18px 20px; border-radius: 16px;
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
  font-size: 15px; animation: fadeUp .28s ease;
}
.answer pre { background: color-mix(in srgb, var(--panel) 72%, transparent); margin-top: 10px; }
.answer .label { display: block; font-size: 11px; letter-spacing: 2px; color: var(--accent-ink); margin-bottom: 6px; font-weight: 700; }
.answer b { color: var(--accent-ink); }
[data-theme="dark"] .answer b { color: #a7f3e9; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.card-foot { margin-top: auto; padding-top: 24px; }

.reveal-btn { width: 100%; padding: 15px; border-radius: 14px; border: 1px dashed var(--line-strong); background: var(--panel-2); color: var(--ink-2); font-size: 15px; font-weight: 600; transition: .18s; }
.reveal-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.opts { display: grid; gap: 9px; margin-top: 20px; }
.opt {
  text-align: left; padding: 12px 16px; border-radius: 13px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  font-size: 14.5px; display: flex; gap: 11px; align-items: flex-start; transition: .16s;
}
.opt .key { flex: 0 0 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 11.5px; background: var(--bg-soft); color: var(--muted); font-weight: 700; margin-top: 1px; }
.opt:hover { border-color: var(--accent); transform: translateX(2px); }
.opt.correct { border-color: var(--accent); background: var(--accent-soft); }
.opt.correct .key { background: var(--accent); color: #fff; }
.opt.wrong { border-color: var(--rose); background: var(--rose-soft); }
.opt.wrong .key { background: var(--rose); color: #fff; }
.opt.dim { opacity: 0.55; }
.opt:disabled { cursor: default; transform: none; }
[data-theme="dark"] .opt.correct .key, [data-theme="dark"] .opt.wrong .key { color: #12161b; }

.cloze { display: flex; gap: 8px; margin-top: 20px; }
.cloze input {
  flex: 1; padding: 13px 16px; border-radius: 13px; border: 1px solid var(--line-strong);
  background: var(--panel-2); color: var(--ink); font-size: 16px; font-family: var(--font); outline: none;
}
.cloze input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.cloze input:disabled { opacity: .6; background: var(--bg-soft); }
.cloze-feedback { margin-top: 8px; font-size: 13px; }
.cloze-feedback.ok { color: var(--accent); }
.cloze-feedback.no { color: var(--rose); }

.ratebar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 13px;
  padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--ink-2); transition: .16s;
}
.rate b { font-size: 14px; }
.rate span { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rate:hover { transform: translateY(-2px); border-color: var(--line-strong); }
.rate[data-g="0"]:hover { background: var(--rose-soft); border-color: var(--rose); color: var(--rose); }
.rate[data-g="1"]:hover { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
.rate[data-g="2"]:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.rate[data-g="3"]:hover { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
.rate kbd { font-size: 9.5px; opacity: .6; }

.kbd-hint { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 16px; }
kbd {
  font-family: var(--mono); font-size: 10.5px; padding: 1px 5px; border-radius: 5px;
  border: 1px solid var(--line-strong); border-bottom-width: 2px; background: var(--panel);
}

.summary { max-width: 620px; margin: 40px auto; text-align: center; }
.summary .big { font-size: 60px; line-height: 1; margin: 10px 0 6px; }
.summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 26px 0; }
.summary-grid div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; }
.summary-grid b { display: block; font-size: 22px; }
.summary-grid span { font-size: 11.5px; color: var(--muted); }

.grid-tips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 26px; font-size: 13.5px; color: var(--ink-2); }
.small { font-size: 13.5px; color: var(--ink-2); line-height: 1.9; }
.lib-active { display: flex; align-items: center; gap: 10px; margin: -4px 0 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.lib-active b { color: var(--accent-ink); }
.lib-active button { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 2px 10px; font-size: 11.5px; }
.lib-active button:hover { color: var(--rose); border-color: var(--rose); }

/* ---------- decks ---------- */
.deck-section { margin-top: 18px; }
.section-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.section-head h2 { font-size: 18px; }
.section-head .add-deck {
  width: 30px; height: 30px; border-radius: 50%;
  font-size: 22px; line-height: 1; padding: 0 0 2px;
  color: var(--accent); background: transparent;
}
.section-head .add-deck:hover { color: #fff; background: var(--accent); border-color: var(--accent); }
.section-head .add-deck:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.new-deck-panel { margin: 10px 0 14px; background: var(--panel); }
.deck-empty {
  padding: 18px; border: 1px dashed var(--line-strong); border-radius: 14px;
  background: var(--panel-2); text-align: center; color: var(--muted); font-size: 13px;
}
.deckgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
.deckcard {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  padding: 16px 18px; display: flex; flex-direction: column; gap: 7px;
  transition: .18s;
}
.deckcard:hover { border-color: var(--line-strong); }
.deckcard.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.deck-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.deckcard h3 { font-size: 17px; line-height: 1.4; }
.deck-desc { min-height: 2.5em; }
.deck-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted); }
.deck-meta code { font-family: var(--mono); font-size: 10.5px; background: var(--panel-2); padding: 1px 6px; border-radius: 6px; }
.deck-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 8px; }
.import-preview { margin-top: 18px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-2); }
.preview-list { list-style: none; padding: 0; margin: 10px 0 16px; display: flex; flex-direction: column; gap: 8px; }
.preview-list li { font-size: 13px; border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
.preview-list li:last-child { border-bottom: 0; }

/* ---------- editor ---------- */
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.field input, .field select, .field textarea,
.type-fields input, .type-fields select, .type-fields textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--panel-2); color: var(--ink);
  font-family: inherit; font-size: 14px; outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus,
.type-fields input:focus, .type-fields select:focus, .type-fields textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.field textarea, .type-fields textarea { min-height: 76px; resize: vertical; line-height: 1.6; }
.type-fields select { width: auto; min-width: 160px; }

<script>
/* MindCard · 卡组运行时
 * 负责：内置/导入卡组、活动卡组、格式校验、Markdown 解析、适配旧版引擎。
 * 在 app.js 之前加载，并把 window.CHAPTERS / window.CARDS 准备好。
 */
(function () {
  'use strict';

  var BUILTIN = window.MC_BUILTIN || [];
  var KEY_INDEX = 'mindcard:deck-index';
  var KEY_DECK = 'mindcard:deck:';
  var KEY_ACTIVE = 'mindcard:active';
  var KEY_TRASH = 'mindcard:deck-trash';
  var KEY_GLOBAL = 'mindcard:settings';
  var KEY_LEGACY = 'mindcard:decks';
  var deckCache = {};

  function safeGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeSet(key, value) {
    try { localStorage.setItem(key, value); return true; }
    catch (e) { return false; }
  }
  function safeRemove(key) {
    try { localStorage.removeItem(key); return true; } catch (e) { return false; }
  }
  function readJSON(key, fallback) {
    var raw = safeGet(key);
    if (!raw) return fallback;
    try {
      var obj = JSON.parse(raw);
      return obj == null ? fallback : obj;
    } catch (e) { return fallback; }
  }
  function writeJSON(key, obj, label) {
    if (!safeSet(key, JSON.stringify(obj))) {
      throw new Error('浏览器存储空间不足，无法保存' + (label || '数据') + '，请先导出备份并清理空间');
    }
  }

  function readIndex() {
    var arr = readJSON(KEY_INDEX, []);
    if (!Array.isArray(arr)) return [];
    return arr.filter(function (x) { return typeof x === 'string'; });
  }
  function writeIndex(ids) {
    // 索引丢失可以靠扫描恢复，因此写入失败不阻断
    safeSet(KEY_INDEX, JSON.stringify(ids));
  }
  function addToIndex(id) {
    var ids = readIndex();
    if (ids.indexOf(id) < 0) { ids.push(id); writeIndex(ids); }
  }
  function removeFromIndex(id) {
    writeIndex(readIndex().filter(function (x) { return x !== id; }));
  }
  function scanDeckIds() {
    var ids = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(KEY_DECK) === 0) ids.push(k.slice(KEY_DECK.length));
      }
    } catch (e) { }
    return ids;
  }
  function importedIds() {
    var ids = readIndex().slice();
    scanDeckIds().forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
    return ids;
  }
  function loadImportedDeck(id) {
    if (deckCache[id]) return deckCache[id];
    var raw = safeGet(KEY_DECK + id);
    if (!raw) return null;
    try {
      var d = JSON.parse(raw);
      if (d && d.id === id && Array.isArray(d.cards)) { deckCache[id] = d; return d; }
    } catch (e) { }
    return null;
  }
  function storeDeck(deck, label) {
    if (!safeSet(KEY_DECK + deck.id, JSON.stringify(deck))) {
      throw new Error('浏览器存储空间不足，无法保存' + (label || '卡组') + '，请先导出备份并清理空间');
    }
    deckCache[deck.id] = deck;
    addToIndex(deck.id);
  }

  /* 把旧版“所有卡组塞在一个键”的数据迁移到一卡组一键 */
  (function migrateLegacy() {
    var raw = safeGet(KEY_LEGACY);
    if (!raw) return;
    try {
      var obj = JSON.parse(raw);
      if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return;
      var migrated = [], valid = 0;
      Object.keys(obj).forEach(function (id) {
        var d = obj[id];
        if (d && d.id === id && Array.isArray(d.cards)) {
          valid++;
          try { storeDeck(d, '迁移卡组'); migrated.push(id); } catch (e) { }
        }
      });
      if (migrated.length && migrated.length === valid) safeRemove(KEY_LEGACY);
    } catch (e) { }
  })();

  function allDecks() {
    var list = BUILTIN.slice();
    importedIds().forEach(function (id) {
      if (list.some(function (d) { return d.id === id; })) return;
      var d = loadImportedDeck(id);
      if (d) list.push(d);
    });
    return list;
  }
  function findDeck(id) {
    if (!id) return null;
    var found = BUILTIN.filter(function (d) { return d.id === id; })[0];
    if (found) return found;
    return loadImportedDeck(id);
  }
  function isBuiltin(id) {
    return BUILTIN.some(function (d) { return d.id === id; });
  }
  function activeId() {
    var fromUrl = null;
    try { fromUrl = new URLSearchParams(location.search).get('deck'); } catch (e) { }
    var id = fromUrl || safeGet(KEY_ACTIVE);
    return findDeck(id) ? id : (BUILTIN[0] ? BUILTIN[0].id : null);
  }
  function setActive(id) {
    if (!findDeck(id)) return;
    safeSet(KEY_ACTIVE, id);
    // 如果当前 URL 带 ?deck=，同步更新，避免切换后被旧链接拉回去
    try {
      var url = new URL(location.href);
      if (url.searchParams.has('deck')) {
        url.searchParams.set('deck', id);
        history.replaceState(null, '', url.pathname + url.search + url.hash);
      }
    } catch (e) { }
  }

  function saveImported(deck) {
    if (isBuiltin(deck.id)) throw new Error('这个 id 与内置卡组冲突，请换一个 id');
    storeDeck(deck, '卡组');
    setActive(deck.id);
  }
  function saveDeckDirect(deck) {
    if (isBuiltin(deck.id)) throw new Error('这个 id 与内置卡组冲突');
    storeDeck(deck, '卡组');
  }
  function updateDeck(deck) {
    if (isBuiltin(deck.id)) throw new Error('内置卡组不能直接修改，请先复制为自定义卡组');
    if (!loadImportedDeck(deck.id)) throw new Error('这个卡组不存在，可能已被删除');
    storeDeck(deck, '卡组修改');
  }
  function deleteImported(id) {
    safeRemove(KEY_DECK + id);
    delete deckCache[id];
    removeFromIndex(id);
    if (safeGet(KEY_ACTIVE) === id && BUILTIN[0]) setActive(BUILTIN[0].id);
  }

  /* ---------------- 卡组回收站 ---------------- */
  function readTrash() {
    var t = readJSON(KEY_TRASH, {});
    return t && typeof t === 'object' && !Array.isArray(t) ? t : {};
  }
  function writeTrash(t) {
    if (!safeSet(KEY_TRASH, JSON.stringify(t))) throw new Error('存储空间不足，无法更新回收站');
  }
  function trashDeck(id) {
    var deck = findDeck(id);
    if (!deck || isBuiltin(id)) return;
    var t = readTrash();
    t[id] = { deck: deck, at: Date.now() };
    writeTrash(t);
    deleteImported(id);
  }
  function trashedDecks() {
    var t = readTrash(), out = [];
    Object.keys(t).forEach(function (id) {
      if (t[id] && t[id].deck) out.push({ id: id, deck: t[id].deck, at: t[id].at || 0 });
    });
    return out.sort(function (a, b) { return b.at - a.at; });
  }
  function restoreDeck(id) {
    var t = readTrash(), item = t[id];
    if (!item || !item.deck) return false;
    storeDeck(item.deck, '恢复卡组');
    delete t[id];
    writeTrash(t);
    setActive(id);
    return true;
  }
  function purgeTrash(id) {
    var t = readTrash();
    delete t[id];
    writeTrash(t);
    safeRemove('mindcard:progress:' + id);
    safeRemove('mindcard:progress:' + id + ':bak');
  }
  function importTrash(list) {
    if (!Array.isArray(list)) return;
    var t = readTrash();
    list.forEach(function (item) {
      if (item && item.deck && item.deck.id && !isBuiltin(item.deck.id)) {
        t[item.deck.id] = { deck: item.deck, at: item.at || Date.now() };
      }
    });
    writeTrash(t);
  }

  /* ---------------- 全局设置 ---------------- */
  function globalSettings() {
    var s = readJSON(KEY_GLOBAL, {});
    return s && typeof s === 'object' && !Array.isArray(s) ? s : {};
  }
  function saveGlobalSettings(obj) {
    writeJSON(KEY_GLOBAL, obj, '设置');
  }

  /* ---------------- 校验 ---------------- */

  function validateDeck(deck, allowEmptyCards) {
    var errors = [];
    if (!deck || typeof deck !== 'object' || Array.isArray(deck)) return ['不是有效的 JSON 对象'];
    if (deck.schemaVersion !== 1) errors.push('schemaVersion 必须为 1');
    if (!deck.id || !/^[a-z0-9][a-z0-9-]{1,63}$/.test(deck.id)) {
      errors.push('id 不合规：只能用小写字母、数字、短横线，2-64 位');
    }
    if (!deck.title || typeof deck.title !== 'string') errors.push('缺少 title');
    if (deck.mode && deck.mode !== 'short' && deck.mode !== 'long') errors.push('mode 只能是 short 或 long');
    if (!Array.isArray(deck.chapters) || !deck.chapters.length) errors.push('chapters 不能为空');
    if (!Array.isArray(deck.cards)) errors.push('cards 必须是数组');
    else if (!allowEmptyCards && !deck.cards.length) errors.push('cards 不能为空');
    if (errors.length) return errors;

    var chIds = {};
    deck.chapters.forEach(function (c) {
      if (!c || typeof c.id !== 'string') { errors.push('章节缺少 id'); return; }
      if (!/^ch-[a-z0-9-]{1,48}$/.test(c.id)) errors.push('章节 id 不合规：' + c.id);
      if (chIds[c.id]) errors.push('章节 id 重复：' + c.id);
      chIds[c.id] = true;
      if (!c.name) errors.push('章节缺少 name：' + c.id);
    });

    var cardIds = {}, questions = {};
    deck.cards.forEach(function (c, i) {
      var at = '第 ' + (i + 1) + ' 张卡';
      if (!c || typeof c !== 'object') { errors.push(at + '不是对象'); return; }
      if (!c.id || !/^[a-zA-Z0-9_-]{1,64}$/.test(c.id)) errors.push(at + '的 id 不合规');
      if (cardIds[c.id]) errors.push('卡片 id 重复：' + c.id);
      cardIds[c.id] = true;
      if (!chIds[c.chapter]) errors.push(at + '引用了不存在的章节：' + c.chapter);
      if (['recall', 'cloze', 'choice', 'judge', 'code'].indexOf(c.type) < 0) {
        errors.push(at + '的类型不合规：' + c.type);
      }
      if (!String(c.question || '').trim() && !c.questionImage) errors.push(at + '缺少 question 或 questionImage');
      if (!String(c.answer || '').trim() && !c.answerImage) errors.push(at + '缺少 answer 或 answerImage');
      if (c.questionImage && !/^data:image\/(png|jpeg|webp|gif);base64,/i.test(c.questionImage)) {
        errors.push(at + '的题目图片格式不合规');
      }
      if (c.answerImage && !/^data:image\/(png|jpeg|webp|gif);base64,/i.test(c.answerImage)) {
        errors.push(at + '的答案图片格式不合规');
      }
      if (c.questionImage && String(c.questionImage).length > 2000000) errors.push(at + '的题目图片太大');
      if (c.answerImage && String(c.answerImage).length > 2000000) errors.push(at + '的答案图片太大');
      if (c.type === 'choice') {
        if (!Array.isArray(c.options) || c.options.length < 2) errors.push(at + '缺少 options');
        else if (typeof c.answerIndex !== 'number' || c.answerIndex < 0 || c.answerIndex >= c.options.length) {
          errors.push(at + '的 answerIndex 越界');
        }
      }
      if (c.type === 'judge' && typeof c.correct !== 'boolean') errors.push(at + '缺少 correct');
      if (c.type === 'cloze' && (!Array.isArray(c.accept) || !c.accept.length)) errors.push(at + '缺少 accept');
      var q = String(c.question || '').replace(/[\s，。；：、,.!?！？（）()]/g, '').toLowerCase();
      if (q && questions[q]) errors.push('题目重复：' + c.id + ' 与 ' + questions[q]);
      else if (q) questions[q] = c.id;
    });

    return errors;
  }

  /* ---------------- Markdown → Deck ---------------- */

  function hash(str) {
    var h = 5381, i;
    for (i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }
  function slug(title) {
    var s = String(title || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    if (s.length >= 2) return s.slice(0, 50);
    return 'deck-' + hash(String(title || 'deck'));
  }
  function cleanName(name) {
    return name.replace(/^第\s*[0-9一二三四五六七八九十百]+\s*[章讲节篇]\s*/, '').trim() || name;
  }

  var Q_RE = /^(?:Q|问|问题)\s*[:：]\s*(.+)$/i;
  var A_RE = /^(?:A|答|答案)\s*[:：]\s*(.+)$/i;
  var HEAD_RE = /^(#{1,6})\s+(.+?)\s*$/;
  var BULLET_RE = /^\s*(?:[-*+•·]|\d+[.、)])\s+(.+?)\s*$/;
  var CH_RE = /^第\s*[0-9一二三四五六七八九十百]+\s*[章讲节篇]/;
  var DEF_RE = /^(.{2,40}?)\s*[:：]\s*(.{6,})$/;

  function parseMarkdown(text, titleHint) {
    var lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
    var chapters = [], cards = [], seen = {}, current = null, pendingQ = null;
    var title = '';

    function addChapter(name) {
      name = name.trim();
      if (!name) return;
      if (current && current.name === name) return;
      var cid = 'ch-' + String(chapters.length + 1).padStart(2, '0');
      current = { id: cid, order: chapters.length + 1, name: name, short: cleanName(name).slice(0, 10) };
      chapters.push(current);
    }
    function ensureChapter() {
      if (!current) addChapter('全部内容');
      return current;
    }
    function addCard(q, a, tag) {
      q = String(q || '').replace(/\s+/g, ' ').trim();
      a = String(a || '').replace(/\r/g, '').split('\n').map(function (line) {
        return line.replace(/[ \t]+/g, ' ').trim();
      }).join('\n').trim();
      if (q.length < 2 || a.length < 1 || q === a) return;
      var key = q.replace(/[\s，。；：、,.!?！？]/g, '').toLowerCase();
      if (seen[key]) return;
      seen[key] = true;
      var ch = ensureChapter();
      cards.push({
        id: 'c-' + String(cards.length + 1).padStart(4, '0'),
        chapter: ch.id,
        type: 'recall',
        tag: tag || '导入',
        question: q,
        answer: a
      });
    }
    function addTable(rows) {
      if (rows.length < 2) return;
      var body = rows.slice(1);
      body.forEach(function (row) {
        if (row.length < 2) return;
        var q = (row[0] || '').trim(), a = (row[1] || '').trim();
        if (!q || !a) return;
        if (/^(问题|知识点|术语|项目|概念)$/.test(q) && /^(答案|解释|定义|说明)$/.test(a)) return;
        addCard(q, a, '表格');
      });
    }

    var i = 0;
    while (i < lines.length) {
      var line = lines[i], t = line.trim();

      // 代码围栏：整段跳过，避免里面的 # / | 被误判
      if (/^(```|~~~)/.test(t)) {
        var fence = t.slice(0, 3);
        i++;
        while (i < lines.length) {
          var endLine = lines[i].trim();
          i++;
          if (endLine.indexOf(fence) === 0) break;
        }
        pendingQ = null;
        continue;
      }

      if (t.indexOf('|') === 0 && t.split('|').length >= 3) {
        var tableLines = [];
        while (i < lines.length && lines[i].trim().indexOf('|') === 0) {
          tableLines.push(lines[i].trim()); i++;
        }
        var rows = [];
        tableLines.forEach(function (tl) {
          if (/^\|?[\s:|-]+\|[\s:|-]*$/.test(tl)) return;
          var cells = tl.replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (x) { return x.trim(); });
          rows.push(cells);
        });
        addTable(rows);
        continue;
      }

      if (!t) { pendingQ = null; i++; continue; }

      var mh = HEAD_RE.exec(line);
      if (mh) {
        var level = mh[1].length, name = mh[2].trim();
        if (level === 1 && !title) { title = name; }
        else if (level <= 2) { addChapter(name); }
        pendingQ = null; i++; continue;
      }
      if (CH_RE.test(t) && t.length <= 60) {
        addChapter(t); pendingQ = null; i++; continue;
      }
      var mq = Q_RE.exec(t);
      if (mq) { pendingQ = mq[1].trim(); i++; continue; }

      var ma = A_RE.exec(t);
      if (ma && pendingQ) {
        var answerLines = [ma[1]];
        i++;
        while (i < lines.length) {
          var nt = lines[i].trim();
          if (!nt) break;
          if (/^(```|~~~)/.test(nt)) {
            var fm = nt.slice(0, 3);
            answerLines.push(lines[i]); i++;
            while (i < lines.length) {
              answerLines.push(lines[i]);
              var closed = lines[i].trim().indexOf(fm) === 0;
              i++;
              if (closed) break;
            }
            continue;
          }
          if (Q_RE.test(nt) || A_RE.test(nt) || HEAD_RE.test(nt) || CH_RE.test(nt) ||
              BULLET_RE.test(nt) || nt.charAt(0) === '|') break;
          answerLines.push(lines[i]); i++;
        }
        addCard(pendingQ, answerLines.join('\n'), '问答');
        pendingQ = null;
        continue;
      }
      if (pendingQ) { addCard(pendingQ, t, '问答'); pendingQ = null; i++; continue; }

      var mb = BULLET_RE.exec(line);
      if (mb) {
        var md = DEF_RE.exec(mb[1].trim());
        if (md && !/^(注意|提示|说明|例如|比如|总结|补充)$/.test(md[1].trim())) {
          addCard(md[1].trim(), md[2].trim(), '要点');
        }
        i++; continue;
      }
      i++;
    }

    if (!title) title = titleHint || '导入的卡组';
    if (!chapters.length) addChapter('全部内容');
    var deck = {
      schemaVersion: 1,
      id: slug(title),
      title: title,
      description: '由 Markdown / 文本导入',
      language: 'zh-CN',
      author: '',
      license: '未声明',
      tags: ['导入'],
      source: { type: 'md' },
      chapters: chapters,
      cards: cards
    };
    return deck;
  }

  /* ---------------- 适配旧版引擎 ---------------- */

  function adapt(deck) {
    var index = {};
    var chapters = deck.chapters.map(function (c, i) {
      index[c.id] = i + 1;
      return { id: i + 1, name: c.name, short: c.short || cleanName(c.name).slice(0, 6) };
    });
    var cards = deck.cards.map(function (c) {
      var o = {
        id: c.id,
        ch: index[c.chapter] || 1,
        type: c.type,
        tag: c.tag || '',
        q: c.question || '',
        a: c.answer || ''
      };
      if (c.questionImage) o.qImage = c.questionImage;
      if (c.answerImage) o.aImage = c.answerImage;
      if (c.accept) o.accept = c.accept.slice();
      if (c.type === 'choice') { o.opts = c.options.slice(); o.ans = c.answerIndex; }
      if (c.type === 'judge') o.ans = c.correct ? 0 : 1;
      if (c.pre) o.pre = c.pre;
      return o;
    });
    return { chapters: chapters, cards: cards };
  }

  /* ---------------- 启动 ---------------- */

  function boot() {
    var active = findDeck(activeId()) || BUILTIN[0] || null;
    if (!active) {
      active = {
        schemaVersion: 1, id: 'empty-deck', title: '空卡组',
        chapters: [{ id: 'ch-01', name: '全部内容' }],
        cards: [{ id: 'c-0001', chapter: 'ch-01', type: 'recall', question: '导入一个卡组开始', answer: '点击顶部「卡组」导入 JSON 或 Markdown。' }]
      };
    }
    setActive(active.id);

    var adapted = adapt(active);
    window.CHAPTERS = adapted.chapters;
    window.CARDS = adapted.cards;
    window.MC_DECK_META = active;
    window.MindCardDecks = {
      all: allDecks,
      find: findDeck,
      active: active,
      activeId: activeId,
      setActive: setActive,
      isBuiltin: isBuiltin,
      saveImported: saveImported,
      saveDeckDirect: saveDeckDirect,
      updateDeck: updateDeck,
      deleteImported: deleteImported,
      trashDeck: trashDeck,
      trashedDecks: trashedDecks,
      restoreDeck: restoreDeck,
      purgeTrash: purgeTrash,
      importTrash: importTrash,
      globalSettings: globalSettings,
      saveGlobalSettings: saveGlobalSettings,
      validateDeck: validateDeck,
      parseMarkdown: parseMarkdown,
      adapt: adapt
    };
  }

  if (window.MindCardStorage && window.MindCardStorage.isDesktop) {
    window.MindCardStorage.ready.then(boot, boot);
  } else {
    boot();
  }
})();

</script>
<script>
/* MindCard · 通用记忆卡引擎（v0.2） */
(function () {
  'use strict';

  function startMindCard() {

  /* ================= 基础常量 ================= */
  var DECK = window.MC_DECK_META || { id: 'default', title: '记忆卡', chapters: [], cards: [] };
  var STORE = 'mindcard:progress:' + DECK.id;
  var DAY = 86400000, MIN = 60000;
  var LADDER = [10 * MIN, 1 * DAY, 2 * DAY, 4 * DAY, 7 * DAY, 15 * DAY, 30 * DAY, 60 * DAY, 120 * DAY, 240 * DAY];
  var MAXSTEP = LADDER.length - 1;
  var CHAPTERS = window.CHAPTERS || [];
  var ALL_CARDS = (window.CARDS || []).slice();
  var ALL_BY_ID = {};
  ALL_CARDS.forEach(function (c) { ALL_BY_ID[c.id] = c; });
  var CARDS = [];
  var byId = {};
  var CHNAME = {}, CHSHORT = {};
  CHAPTERS.forEach(function (c) { CHNAME[c.id] = c.name; CHSHORT[c.id] = c.short; });

  var TYPELABEL = { cloze: '填空', choice: '选择', judge: '判断', recall: '简答', code: '代码/计算' };
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  var GRADES = [
    { g: 0, label: '忘记', color: 'var(--rose)' },
    { g: 1, label: '模糊', color: 'var(--gold)' },
    { g: 2, label: '记住', color: 'var(--accent)' },
    { g: 3, label: '简单', color: 'var(--blue)' }
  ];

  /* ================= 状态 ================= */
  var GLOBAL = (window.MindCardDecks && window.MindCardDecks.globalSettings()) || {};
  var storageNotice = null;
  var lastBackupAt = 0;

  function defaultState() {
    return {
      v: 1, created: Date.now(), cards: {}, log: [], hidden: {},
      settings: { newPerDay: 20, reviewLimit: 160, theme: 'light', examDate: '' }
    };
  }
  function validState(s) {
    if (!(s && s.v === 1 && s.cards && typeof s.cards === 'object' && !Array.isArray(s.cards))) return false;
    if (s.log != null && !Array.isArray(s.log)) return false;
    if (s.hidden != null && (typeof s.hidden !== 'object' || Array.isArray(s.hidden))) return false;
    var ids = Object.keys(s.cards);
    for (var i = 0; i < ids.length; i++) {
      var st = s.cards[ids[i]];
      if (st && (typeof st !== 'object' || typeof st.due !== 'number' || isNaN(st.due))) return false;
    }
    return true;
  }
  var S = loadState() || defaultState();
  S.settings = Object.assign({ newPerDay: 20, reviewLimit: 160, theme: 'light', examDate: '' }, S.settings || {});
  S.cards = S.cards || {};
  S.log = Array.isArray(S.log) ? S.log : [];
  S.hidden = (S.hidden && typeof S.hidden === 'object' && !Array.isArray(S.hidden)) ? S.hidden : {};
  if (!GLOBAL.theme) GLOBAL.theme = S.settings.theme || 'light';

  CARDS = ALL_CARDS.filter(function (c) { return !S.hidden[c.id]; });
  CARDS.forEach(function (c) { byId[c.id] = c; });

  function loadState() {
    var raw = null;
    try {
      raw = localStorage.getItem(STORE);
      // 兼容旧版单课程应用的进度键（由卡组通过 legacyProgressKey 声明）
      if (!raw && DECK.legacyProgressKey) raw = localStorage.getItem(DECK.legacyProgressKey);
      if (!raw) {
        try {
          var missingBak = localStorage.getItem(STORE + ':bak');
          if (missingBak) {
            var mb = JSON.parse(missingBak);
            if (validState(mb)) {
              storageNotice = '检测到当前卡组主进度缺失，已从备份恢复。建议立即导出备份。';
              return mb;
            }
          }
        } catch (e) { }
        return null;
      }

      var s = null;
      try { s = JSON.parse(raw); } catch (e) { s = null; }
      if (validState(s)) return s;

      // 主数据损坏：保留现场，再尝试备份
      try { localStorage.setItem('mindcard:corrupt:' + Date.now(), raw); } catch (e) { }
      try {
        var bak = localStorage.getItem(STORE + ':bak');
        if (bak) {
          var b = JSON.parse(bak);
          if (validState(b)) {
            storageNotice = '检测到进度数据损坏，已从上次备份恢复。建议立即导出备份。';
            return b;
          }
        }
      } catch (e) { }
      storageNotice = '检测到进度数据损坏，且没有可用备份。已保留原始数据，请导出排查。';
      return null;
    } catch (e) { return null; }
  }
  function save() {
    try {
      if (S.log.length > 6000) S.log = S.log.slice(-6000);
      var json = JSON.stringify(S);
      // 每分钟留一份上一版本，主数据损坏时可回退
      try {
        var prev = localStorage.getItem(STORE);
        if (prev && Date.now() - lastBackupAt > 60000) {
          localStorage.setItem(STORE + ':bak', prev);
          lastBackupAt = Date.now();
        }
      } catch (e) { }
      localStorage.setItem(STORE, json);
      hideStorageWarning('save');
      return true;
    } catch (e) {
      showStorageWarning('保存失败：浏览器存储不可用或空间不足。本次修改没有写入，请立即导出备份。', 'save');
      return false;
    }
  }

  /* ================= 时间与格式化 ================= */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dayKey(ts) {
    var d = new Date(ts == null ? Date.now() : ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function dayStart(ts) {
    var d = new Date(ts == null ? Date.now() : ts);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }
  function dateStr(ts) {
    var d = new Date(ts == null ? Date.now() : ts);
    return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 星期' + WEEK[d.getDay()];
  }
  function fmtGap(ms) {
    if (ms < 0) ms = 0;
    if (ms < 60 * MIN) return Math.max(1, Math.round(ms / MIN)) + ' 分钟';
    if (ms < DAY) return Math.round(ms / (60 * MIN)) + ' 小时';
    if (ms < 30 * DAY) return Math.round(ms / DAY) + ' 天';
    if (ms < 365 * DAY) return Math.round(ms / (30 * DAY)) + ' 个月';
    return Math.round(ms / (365 * DAY)) + ' 年';
  }
  function fmtDuration(ms) {
    var s = Math.round(ms / 1000);
    if (s < 60) return s + ' 秒';
    return Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒';
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function inline(s) {
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }
  function md(s) {
    var parts = String(s == null ? '' : s).split(/```[a-zA-Z]*\n?/);
    return parts.map(function (p, i) {
      if (i % 2 === 1) return '<pre class="code">' + esc(p.replace(/\n$/, '')) + '</pre>';
      return inline(p);
    }).join('');
  }

  /* ================= SRS 算法 ================= */
  function intervalFor(step, ease) {
    var base = LADDER[Math.min(Math.max(step, 0), MAXSTEP)];
    var f = Math.max(0.8, Math.min(1.35, ease / 2.5));
    return Math.round(base * f);
  }
  function scheduleCore(prev, g) {
    var now = Date.now();
    var isNew = !prev;
    var st = prev ? Object.assign({}, prev) : { step: -1, ease: 2.5, reps: 0, lapses: 0, due: 0, last: 0, lastG: null };
    var step = st.step < 0 ? 0 : st.step;
    var ease = st.ease || 2.5;
    var due;

    st.reps = (st.reps || 0) + 1;
    st.last = now;
    st.lastG = g;

    if (isNew) {
      if (g === 0) { step = 0; due = now + 10 * MIN; }
      else if (g === 1) { step = 0; due = now + 30 * MIN; }
      else if (g === 2) { step = 1; due = now + intervalFor(1, ease); }
      else { step = 2; ease = Math.min(3.2, ease + 0.1); due = now + intervalFor(2, ease); }
    } else if (g === 0) {
      st.lapses = (st.lapses || 0) + 1;
      step = 0; ease = Math.max(1.3, ease - 0.2); due = now + 10 * MIN;
    } else if (g === 1) {
      step = Math.max(1, step); ease = Math.max(1.3, ease - 0.05);
      due = now + Math.max(30 * MIN, Math.round(intervalFor(step, ease) * 0.6));
    } else if (g === 2) {
      step = Math.min(MAXSTEP, step + 1);
      due = now + intervalFor(step, ease);
    } else {
      step = Math.min(MAXSTEP, step + 2);
      ease = Math.min(3.2, ease + 0.15);
      due = now + Math.round(intervalFor(step, ease) * 1.3);
    }
    st.step = step; st.ease = ease; st.due = due;
    return st;
  }
  function schedule(cardId, g) { return scheduleCore(S.cards[cardId], g); }
  function previewGap(cardId, g) {
    var st = scheduleCore(S.cards[cardId], g);
    return fmtGap(st.due - Date.now());
  }
  function stOf(id) { return S.cards[id]; }
  function isMastered(st) { return st && st.step >= 5; }

  /* ================= 统计 ================= */
  function todayStats() {
    var start = dayStart();
    var t = S.log.filter(function (l) { return l.t >= start; });
    var set = {};
    t.forEach(function (l) { set[l.id] = 1; });
    return {
      entries: t.length,
      distinct: Object.keys(set).length,
      news: t.filter(function (l) { return l.n === 1; }).length,
      correct: t.filter(function (l) { return l.g >= 2; }).length
    };
  }
  function streak() {
    var days = {};
    S.log.forEach(function (l) { days[dayKey(l.t)] = 1; });
    var n = 0, d = new Date();
    if (!days[dayKey(d.getTime())]) d.setDate(d.getDate() - 1);
    while (days[dayKey(d.getTime())]) {
      n++; d.setDate(d.getDate() - 1);
      if (n > 3650) break;
    }
    return n;
  }
  function dueNow() {
    var now = Date.now();
    return CARDS.filter(function (c) { var st = S.cards[c.id]; return st && st.due <= now; });
  }
  function newLeft() {
    var unlearned = CARDS.filter(function (c) { return !S.cards[c.id]; }).length;
    var quota = Math.max(0, S.settings.newPerDay - todayStats().news);
    return Math.min(unlearned, quota);
  }
  function masteredCount() {
    return CARDS.filter(function (c) { return isMastered(S.cards[c.id]); }).length;
  }
  function learnedCount() {
    return CARDS.filter(function (c) { return !!S.cards[c.id]; }).length;
  }
  function forecast(days) {
    var out = [], base = dayStart();
    for (var i = 0; i < days; i++) out.push(0);
    CARDS.forEach(function (c) {
      var st = S.cards[c.id];
      if (!st) return;
      if (st.due < base) { out[0]++; return; }
      var idx = Math.floor((st.due - base) / DAY);
      if (idx >= 0 && idx < days) out[idx]++;
    });
    return out;
  }
  function examInfo() {
    var d = S.settings.examDate;
    if (!d) return null;
    var target = new Date(d + 'T00:00:00').getTime();
    if (isNaN(target)) return null;
    return { days: Math.ceil((target - dayStart()) / DAY), date: d };
  }
  function chapterStat(chId) {    var arr = CARDS.filter(function (c) { return c.ch === chId; });
    var learned = 0, mastered = 0;
    arr.forEach(function (c) {
      var st = S.cards[c.id];
      if (st) learned++;
      if (isMastered(st)) mastered++;
    });
    return { total: arr.length, learned: learned, mastered: mastered };
  }

  /* ================= 会话 ================= */
  var session = null;
  var ui = { q: '', filter: 'all', chapter: 0, pendingDeck: null, editDirty: false, editMetaDirty: false, editQuery: '', editFilter: 'all', editDeckId: '', cardQImage: '', cardAImage: '', showNewDeck: false };

  function buildSession(opts) {
    opts = opts || {};
    var mode = opts.mode || 'daily';
    var ch = opts.chapter || 0;
    var now = Date.now();
    var scope = CARDS.filter(function (c) { return !ch || c.ch === ch; });
    var queue = [];

    if (mode === 'single' && opts.id) {
      queue = [opts.id];
    } else if (mode === 'daily') {
      var ts = todayStats();
      var rLimit = Math.max(0, S.settings.reviewLimit - ts.entries);
      var reviews = scope.filter(function (c) { var st = S.cards[c.id]; return st && st.due <= now; })
        .sort(function (a, b) { return S.cards[a.id].due - S.cards[b.id].due; })
        .slice(0, rLimit);
      var nLimit = Math.max(0, S.settings.newPerDay - ts.news);
      var news = scope.filter(function (c) { return !S.cards[c.id]; }).slice(0, nLimit);
      queue = reviews.concat(news);
      if (ch) {
        // 按章复习时放宽每日新卡限制
        var rest = scope.filter(function (c) { return !S.cards[c.id]; });
        queue = reviews.concat(rest);
      }
    } else if (mode === 'chapter') {
      var due = scope.filter(function (c) { var st = S.cards[c.id]; return st && st.due <= now; })
        .sort(function (a, b) { return S.cards[a.id].due - S.cards[b.id].due; });
      var fresh = scope.filter(function (c) { return !S.cards[c.id]; });
      queue = due.concat(fresh);
    } else if (mode === 'ahead') {
      queue = scope.slice().sort(function (a, b) {
        var sa = S.cards[a.id], sb = S.cards[b.id];
        if (!sa && !sb) return 0;
        if (!sa) return 1;
        if (!sb) return -1;
        return sa.due - sb.due;
      }).slice(0, opts.limit || 30);
    }

    if (!queue.length) { toast('这里暂时没有需要复习的卡片'); return false; }
    queue = queue.map(function (c) { return typeof c === 'string' ? c : c.id; });
    session = {
      queue: queue, idx: 0, mode: mode, chapter: ch,
      start: Date.now(), revealed: false, choice: null,
      clozeVal: '', clozeOk: null, history: [],
      counts: [0, 0, 0, 0], unique: {}, relearn: {}, initialTotal: queue.length
    };
    return true;
  }

  function currentCard() {
    if (!session) return null;
    var id = session.queue[session.idx];
    return id ? byId[id] : null;
  }

  function goStudy() {
    if (currentRoute().path === 'study') render();
    else location.hash = '#/study';
    window.scrollTo(0, 0);
  }
  function begin(opts) {
    var ok = buildSession(opts);
    if (!ok && opts && opts.mode === 'daily') {
      ok = buildSession({ mode: 'ahead', limit: 30 });
      if (ok) toast('今日到期已清空，进入自由复习');
    }
    if (ok) goStudy();
  }

  function grade(g) {
    var card = currentCard();
    if (!card || !session) return;
    var isNew = !S.cards[card.id];

    session.history = session.history || [];
    session.history.push({
      cardId: card.id,
      prev: S.cards[card.id] ? JSON.parse(JSON.stringify(S.cards[card.id])) : null,
      logLen: S.log.length,
      idx: session.idx,
      queue: session.queue.slice(),
      counts: session.counts.slice(),
      unique: Object.assign({}, session.unique),
      relearn: Object.assign({}, session.relearn),
      finished: !!session.finished
    });
    if (session.history.length > 30) session.history.shift();

    var st = schedule(card.id, g);
    S.cards[card.id] = st;
    S.log.push({ t: Date.now(), id: card.id, g: g, n: isNew ? 1 : 0 });
    save();

    session.counts[g]++;
    session.unique[card.id] = 1;

    // “忘记”的卡片在本轮稍后再出现一次（最多 2 次）
    if (g === 0 && (session.relearn[card.id] || 0) < 2) {
      session.relearn[card.id] = (session.relearn[card.id] || 0) + 1;
      var at = Math.min(session.queue.length, session.idx + 3);
      session.queue.splice(at, 0, card.id);
    }

    session.idx++;
    session.revealed = false;
    session.choice = null;
    session.clozeVal = '';
    session.clozeOk = null;
    if (session.idx >= session.queue.length) {
      session.finished = true;
    }
    render();
  }

  function undoGrade() {
    if (!session || !session.history || !session.history.length) return;
    var snap = session.history.pop();
    if (snap.prev) S.cards[snap.cardId] = snap.prev;
    else delete S.cards[snap.cardId];
    S.log.length = snap.logLen;
    save();
    session.idx = snap.idx;
    session.queue = snap.queue;
    session.counts = snap.counts;
    session.unique = snap.unique;
    session.relearn = snap.relearn;
    session.finished = false;
    session.revealed = true;
    session.choice = null;
    session.clozeVal = '';
    session.clozeOk = null;
    render();
    toast('已撤销上一张的评分');
  }
  function skipCard() {
    if (!session) return;
    if (session.idx >= session.queue.length - 1) {
      toast('这是最后一张，先评分吧');
      return;
    }
    var id = session.queue.splice(session.idx, 1)[0];
    session.queue.push(id);
    session.revealed = false;
    session.choice = null;
    session.clozeVal = '';
    session.clozeOk = null;
    render();
    toast('已跳过，稍后会再出现');
  }

  /* ================= 提示 ================= */
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1900);
  }

  function ensureStorageWarning() {
    var el = document.getElementById('storageWarning');
    if (el) return el;
    el = document.createElement('div');
    el.id = 'storageWarning';
    el.className = 'storage-warning';
    el.innerHTML = '<div class="sw-text"></div><div class="sw-actions">' +
      '<button class="btn sm" data-act="export-all">导出全部备份</button>' +
      '<button class="btn ghost sm" data-act="reload-app">刷新页面</button></div>';
    document.body.appendChild(el);
    return el;
  }
  function showStorageWarning(msg, kind) {
    var el = ensureStorageWarning();
    el.querySelector('.sw-text').textContent = msg;
    el.dataset.kind = kind || 'info';
    el.classList.add('show');
  }
  function hideStorageWarning(kind) {
    var el = document.getElementById('storageWarning');
    if (!el) return;
    if (kind && el.dataset.kind !== kind) return;
    el.classList.remove('show');
  }

  /* ================= 视图：今日 ================= */
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }

  function hasSheet() {
    return false;
  }

  /* ================= 卡组生命周期：短期 / 长期 ================= */
  function deckMode(deck) {
    if (!deck) return 'short';
    if (MindCardDecks.isBuiltin(deck.id)) return 'builtin';
    return deck.mode === 'long' ? 'long' : 'short';
  }
  function isEditableDeck(deck) {
    return deckMode(deck) === 'short';
  }
  function shortLimit() {
    var n = parseInt(GLOBAL.shortDeckLimit, 10);
    if (isNaN(n)) return 20;
    return Math.max(1, Math.min(20, n));
  }
  function shortDecks() {
    return MindCardDecks.all().filter(function (d) { return deckMode(d) === 'short'; });
  }
  function canAddShort(excludeId) {
    var list = shortDecks();
    // 覆盖一个已经存在的短期卡组不增加数量，即使当前已经超限也允许
    if (excludeId && list.some(function (d) { return d.id === excludeId; })) return true;
    return list.length < shortLimit();
  }
  function modeLabel(mode) {
    return mode === 'long' ? '长期' : (mode === 'builtin' ? '内置' : '短期');
  }

  /* ================= 图片题 ================= */
  function isImageData(data) {
    return typeof data === 'string' && /^data:image\/(png|jpeg|webp|gif);base64,/i.test(data);
  }
  function imageTag(data, alt, cls) {
    if (!isImageData(data)) return '';
    return '<img class="card-img' + (cls ? ' ' + cls : '') + '" src="' +
      data.replace(/"/g, '&quot;') + '" alt="' + esc(alt || '图片') + '" loading="lazy">';
  }
  function imageFieldContent(which, data) {

  function processImageFile(file, which) {
    if (!file) return;
    if (!/^image\/(png|jpeg|webp|gif)$/i.test(file.type)) {
      alert('只支持 PNG / JPEG / WebP / GIF 图片。');
      return;
    }
    if (file.size > 12 * 1024 * 1024) {
      alert('图片超过 12 MB，请先裁剪或压缩。');
      return;
    }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try {
        var maxSide = 1400;
        var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);

        var mime = 'image/webp';
        var out = canvas.toDataURL(mime, 0.82);
        if (out.indexOf('data:image/webp') !== 0) {
          mime = 'image/jpeg';
          out = canvas.toDataURL(mime, 0.82);
        }
        var quality = 0.82;
        while (out.length > 420000 && quality > 0.5) {
          quality -= 0.08;
          out = canvas.toDataURL(mime, quality);
        }
        if (out.length > 600000) {
          alert('图片压缩后仍然太大（约 ' + Math.round(out.length / 1024) + ' KB）。请裁剪后再试。');
          return;
        }
        setCardImage(which, out);
        toast('图片已加入（约 ' + Math.round(out.length / 1024) + ' KB）');
      } catch (e) {
        alert('处理图片失败：' + e.message);
      } finally {
        URL.revokeObjectURL(url);
      }
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      alert('无法读取这张图片，请换一张试试。');
    };
    img.src = url;
  }
  function onPaste(e) {
    if (currentRoute().path !== 'edit') return;
    var id = e.target && e.target.id;
    if (id !== 'cardQuestion' && id !== 'cardAnswer') return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        var f = items[i].getAsFile();
        if (f) {
          e.preventDefault();
          processImageFile(f, id === 'cardQuestion' ? 'q' : 'a');
        }
        break;
      }
    }
  }

  function curveSVG() {
    var W = 340, H = 140, padL = 8, padR = 8, padT = 10, padB = 18;
    var pts = [];
    var tMax = 30;
    for (var t = 0; t <= tMax; t += 0.25) {
      var x = padL + (Math.log(1 + t) / Math.log(1 + tMax)) * (W - padL - padR);
      var r = Math.exp(-t / 6);
      var y = padT + (1 - r) * (H - padT - padB);
      pts.push(x.toFixed(1) + ',' + y.toFixed(1));
    }
    var dots = [1, 2, 4, 7, 15, 30].map(function (d) {
      var x = padL + (Math.log(1 + d) / Math.log(1 + tMax)) * (W - padL - padR);
      var r = Math.exp(-d / 6);
      var y = padT + (1 - r) * (H - padT - padB);
      return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.2" fill="var(--accent)"/>';
    }).join('');
    return '<div class="curve-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<polyline fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" points="' + pts.join(' ') + '"/>' +
      dots +
      '<text x="' + padL + '" y="' + (H - 4) + '" font-size="9" fill="var(--muted)">0</text>' +
      '<text x="' + (W - 34) + '" y="' + (H - 4) + '" font-size="9" fill="var(--muted)">30 天</text>' +
      '<text x="' + (W - 46) + '" y="' + (padT + 10) + '" font-size="9" fill="var(--muted)">保持率</text>' +
      '</svg></div>';
  }

  /* ================= 视图：统计 ================= */
  function viewStats() {
    var total = CARDS.length;
    var learned = learnedCount();
    var mastered = masteredCount();
    var all = S.log.length;
    var good = S.log.filter(function (l) { return l.g >= 2; }).length;
    var rate = all ? Math.round((good / all) * 100) : 0;
    var fc = forecast(14);
    var maxFc = Math.max.apply(null, fc.concat([1]));

    var counts = [0, 0, 0, 0];
    S.log.forEach(function (l) { counts[l.g] = (counts[l.g] || 0) + 1; });

    // 84 天热力图
    var cells = '';
    var base = dayStart();
    var map = {};
    S.log.forEach(function (l) { var k = dayKey(l.t); map[k] = (map[k] || 0) + 1; });
    for (var i = 83; i >= 0; i--) {
      var key = dayKey(base - i * DAY);
      var n = map[key] || 0;
      var lv = n === 0 ? 0 : n < 5 ? 1 : n < 15 ? 2 : n < 30 ? 3 : 4;
      cells += '<div class="hm' + (lv ? ' l' + lv : '') + '" title="' + key + '：' + n + ' 次复习"></div>';
    }

    var fcHtml = fc.map(function (n, i) {
      var h = Math.max(3, Math.round((n / maxFc) * 100));
      var d = new Date(); d.setDate(d.getDate() + i);
      return '<div class="day"><div class="n">' + n + '</div><div class="col' + (n === 0 ? ' zero' : '') + '" style="height:' + h + '%"></div>' +
        '<div class="d' + (i === 0 ? ' today' : '') + '">' + (i === 0 ? '今天' : (d.getMonth() + 1) + '/' + d.getDate()) + '</div></div>';
    }).join('');

    var maxC = Math.max.apply(null, counts.concat([1]));
    var gradeBars = GRADES.map(function (g) {
      var c = counts[g.g] || 0;
      return '<div class="gradebar"><span>' + g.label + '</span>' +
        '<span class="track"><i style="width:' + Math.round((c / maxC) * 100) + '%;background:' + g.color + '"></i></span>' +
        '<span class="muted">' + c + '</span></div>';
    }).join('');

    var chRows = CHAPTERS.map(function (ch) {
      var s = chapterStat(ch.id);
      var p = pct(s.mastered, s.total);
      return '<a class="chrow" href="#/library?ch=' + ch.id + '">' +
        '<span class="idx">' + pad(ch.id) + '</span><span class="name">' + esc(ch.name) + '</span>' +
        '<span class="bar"><i style="width:' + p + '%"></i></span>' +
        '<span class="pct">' + s.mastered + '/' + s.total + '</span></a>';
    }).join('');

    return '<div class="page-head"><div><p class="eyebrow">学习数据</p><h1>统计</h1>' +
      '<p class="lead">所有记录只保存在本机浏览器中，可随时导出备份。</p></div></div>' +
      '<div class="stat-grid">' +
      '<div class="stat cool"><span class="k">已掌握</span><span class="v">' + mastered + '<small>/ ' + total + '</small></span></div>' +
      '<div class="stat"><span class="k">已学</span><span class="v">' + learned + '<small>/ ' + total + '</small></span></div>' +
      '<div class="stat"><span class="k">累计复习</span><span class="v">' + all + '<small>次</small></span></div>' +
      '<div class="stat warm"><span class="k">正确率（记住+简单）</span><span class="v">' + rate + '<small>%</small></span></div>' +
      '</div>' +

      '<section class="panel" style="margin-top:16px"><div class="panel-head"><h2>复习热力图</h2><span class="muted">最近 12 周</span></div>' +
      '<div class="heatmap">' + cells + '</div>' +
      '<div class="hm-legend">少<span class="hm"></span><span class="hm l1"></span><span class="hm l2"></span><span class="hm l3"></span><span class="hm l4"></span>多</div></section>' +

      '<div class="cols even" style="margin-top:16px">' +
      '<section class="panel"><div class="panel-head"><h2>评分分布</h2></div><div class="gradebars">' + gradeBars + '</div>' +
      '<p class="tiny muted" style="margin-top:12px">如果「忘记」长期偏高，说明新卡节奏过快，可以调低每日新卡上限。</p></section>' +
      '<section class="panel"><div class="panel-head"><h2>未来 14 天到期</h2></div><div class="forecast" style="height:120px">' + fcHtml + '</div></section>' +
      '</div>' +

      '<section class="panel" style="margin-top:16px"><div class="panel-head"><h2>章节掌握度</h2><span class="muted">已掌握 = 复习间隔 ≥ 15 天</span></div>' +
      '<div class="chapters">' + chRows + '</div></section>';
  }

  /* ================= 视图：卡组 ================= */
  function deckCardHtml(d, activeId) {
    var mode = deckMode(d);
    var builtin = mode === 'builtin';
    var editable = mode === 'short';
    var isActive = d.id === activeId;
    var badge = isActive ? '使用中' : modeLabel(mode);
    var badgeClass = isActive ? 'accent' : (mode === 'long' ? 'gold' : '');
    var actions = '';
    if (!isActive) actions += '<button class="btn sm" data-act="switch-deck" data-id="' + d.id + '">切换</button>';
    if (editable) actions += '<a class="btn ghost sm" href="#/edit?id=' + d.id + '">编辑</a>';
    if (!editable) actions += '<button class="btn ghost sm" data-act="clone-deck" data-id="' + d.id + '">另存为短期</button>';
    actions += '<button class="btn ghost sm" data-act="export-deck" data-id="' + d.id + '">导出</button>';
    if (editable) actions += '<button class="btn ghost sm" data-act="convert-long" data-id="' + d.id + '">转为长期</button>';
    if (!builtin) actions += '<button class="btn ghost sm" data-act="delete-deck" data-id="' + d.id + '" style="color:var(--rose);border-color:var(--rose)">删除</button>';
    return '<div class="deckcard' + (isActive ? ' active' : '') + '">' +
      '<div class="deck-top"><span class="chip ' + badgeClass + '">' + badge + '</span>' +
      '<span class="tiny muted">' + esc(d.language || '') + '</span></div>' +
      '<h3>' + esc(d.title) + '</h3>' +
      '<p class="tiny muted deck-desc">' + esc(d.subtitle || d.description || '—') + '</p>' +
      '<div class="deck-meta"><span>' + d.chapters.length + ' 章 · ' + d.cards.length + ' 卡</span>' +
      '<code>' + esc(d.id) + '</code></div>' +
      '<div class="deck-actions">' + actions + '</div></div>';
  }

  function viewDecks() {

      '<div class="field"><label>卡组名称</label><input id="newDeckName" maxlength="80" placeholder="例如：数据结构期末"></div>' +

      '</div>' +
      '<div class="field"><label>描述（可选）</label><input id="newDeckDesc" maxlength="200" placeholder="这门课考什么、怎么用"></div>' +

    function grid(list, emptyText) {
      if (!list.length) return '<div class="empty deck-empty">' + esc(emptyText) + '</div>';

    var pending = ui.pendingDeck;

        '<button class="btn ghost" data-act="cancel-pending">取消</button></div></div>';
    }

    return '<div class="page-head"><div><p class="eyebrow">卡组</p><h1>卡组</h1>' +
      '<p class="lead">短期卡组可在网页里编辑，长期卡组只读；两者都可以导出为 JSON 文件保存到电脑。</p></div>' +
      '<div class="right"><button class="btn ghost sm" data-act="export-all">导出全部</button>' +
      '<button class="btn ghost sm" data-act="import-deck">导入卡组</button></div></div>' +

      '<section class="deck-section"><div class="section-head">' +
      '<h2>短期卡组</h2><span class="chip ' + (over ? 'gold' : 'accent') + '">' + shorts.length + ' / ' + limit + '</span>' +

      '<span class="tiny muted">可编辑 · ' + (over ? '已超过上限，请转为长期或删除' : '上限 ' + limit + ' 个') + '</span></div>' +
      (showNew ? createPanel : '') +
      grid(shorts, '还没有短期卡组。点左上角「+」新建，或导入一个 JSON/Markdown。') + '</section>' +

      '<section class="deck-section"><div class="section-head">' +
      '<h2>长期卡组</h2><span class="chip gold">只读</span>' +

      grid(longs, '还没有长期卡组。把短期卡组“转为长期”后会出现在这里。') + '</section>' +

      '<section class="deck-section"><div class="section-head">' +

      grid(builtins, '没有内置卡组。') + '</section>' +

      '<section class="panel" style="margin-top:16px"><div class="panel-head"><h2>导入已有内容</h2>' +

      '<p class="small">支持 <b>卡组 JSON</b> 与 <b>Markdown / TXT</b>。Markdown 里用 <code>Q:</code> / <code>A:</code>、两列表格或 <code>术语：定义</code> 来组织内容，识别率最高。</p>' +
      '<p class="small muted" style="margin-top:6px">导入的卡组和学习进度只保存在当前浏览器；内置卡组随网页发布，所有访问者都能看到。</p>' +
      (full ? '<p class="small" style="color:var(--gold)">短期卡组已满，导入前请先转长期或删除一个。</p>' : '') +
      '<div class="hero-actions" style="margin-top:14px">' +
      '<button class="btn" data-act="import-deck">导入 .json 卡组</button>' +
      '<button class="btn ghost" data-act="import-notes">用 .md / .txt 生成</button>' +

      preview + '</section>';
  }

  /* ================= 视图：编辑卡组 ================= */
  function viewEdit(query) {
    var m = /(?:^|&)id=([^&]+)/.exec(query || '');
    var id = '';
    try { id = m ? decodeURIComponent(m[1]) : ''; } catch (e) { id = ''; }
    var deck = MindCardDecks.find(id);
    if (!deck) {
      return '<div class="page-head"><div><p class="eyebrow">卡组编辑</p><h1>找不到卡组</h1>' +
        '<p class="lead">它可能已被删除。</p></div></div>' +
        '<div class="hero-actions"><a class="btn" href="#/decks">返回卡组</a></div>';
    }
    if (MindCardDecks.isBuiltin(deck.id)) {
      return '<div class="page-head"><div><p class="eyebrow">卡组编辑</p><h1>内置卡组不可编辑</h1>' +
        '<p class="lead">内置示例是只读的。你可以复制为短期卡组后修改，或直接导出。</p></div></div>' +
        '<div class="hero-actions"><button class="btn" data-act="clone-deck" data-id="' + deck.id + '">复制为短期卡组</button>' +
        '<button class="btn ghost" data-act="export-deck" data-id="' + deck.id + '">导出到文件</button>' +
        '<a class="btn ghost" href="#/decks">返回卡组</a></div>';
    }
    if (deckMode(deck) === 'long') {
      return '<div class="page-head"><div><p class="eyebrow">卡组编辑</p><h1>长期卡组（只读）</h1>' +
        '<p class="lead">长期卡组在网页内不能修改，但可以正常复习。需要修改时，导出 JSON 编辑后重新导入，或另存为短期副本。</p></div></div>' +
        '<section class="panel"><p class="small"><b>' + esc(deck.title) + '</b> · ' +
        (deck.cards || []).length + ' 张卡片 · 只读</p>' +
        '<div class="hero-actions" style="margin-top:16px">' +
        '<button class="btn" data-act="export-deck" data-id="' + deck.id + '">导出到文件</button>' +
        '<button class="btn ghost" data-act="clone-deck" data-id="' + deck.id + '">另存为短期副本</button>' +
        '<a class="btn ghost" href="#/decks">返回卡组</a></div></section>';
    }
    if (ui.editDeckId !== deck.id) {
      ui.editDeckId = deck.id;
      ui.editQuery = '';
      ui.editFilter = 'all';
      ui.editCardId = null;
      ui.editDirty = false;
      ui.editMetaDirty = false;
      ui.cardQImage = '';
      ui.cardAImage = '';
    }

    var cards = deck.cards || [];
    var edit = null;
    if (ui.editCardId) {
      for (var i = 0; i < cards.length; i++) {
        if (cards[i].id === ui.editCardId) { edit = cards[i]; break; }
      }
    }
    var type = edit ? edit.type : (ui.cardType || 'recall');
    var target = deck.targetCards || 0;
    var countText = target ? (cards.length + ' / ' + target + ' 张') : (cards.length + ' 张');
    var chapterOpts = deck.chapters.map(function (c) {
      return '<option value="' + c.id + '"' + (edit && edit.chapter === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join('');

    var typeOpts = [['recall', '简答 / 自评'], ['cloze', '填空'], ['choice', '选择'], ['judge', '判断'], ['code', '代码 / 计算']];
    var typeSelect = typeOpts.map(function (t) {
      return '<option value="' + t[0] + '"' + (type === t[0] ? ' selected' : '') + '>' + t[1] + '</option>';
    }).join('');

    var letters = 'ABCDEFGH';

    var indexOpts = '';
    for (var k = 0; k < 8; k++) {
      indexOpts += '<option value="' + k + '"' + (answerIndex === k ? ' selected' : '') + '>' + letters.charAt(k) + '</option>';

    var fieldsChoice = edit && edit.type === 'choice' ? '' : ' style="display:none"';
    var fieldsJudge = edit && edit.type === 'judge' ? '' : ' style="display:none"';
    var fieldsCode = edit && edit.type === 'code' ? '' : ' style="display:none"';

      '<button class="btn ghost sm" data-act="export-deck" data-id="' + deck.id + '">导出到文件</button>' +
      '<button class="btn ghost sm" data-act="convert-long" data-id="' + deck.id + '">转为长期</button>' +
      '<button class="btn sm" data-act="finish-edit" data-id="' + deck.id + '">完成，去复习</button></div></div>' +

      '<div class="cols even">' +

      '<div class="field"><label>描述（可选）</label><input id="deckDesc" maxlength="200" value="' + esc(deck.description || '') + '"></div>' +
      '<div class="form-row">' +

      '<div id="fields-choice" class="type-fields"' + fieldsChoice + '>' +
      '<div class="field"><label>选项（每行一个，2～8 个）</label>' +
      '<textarea id="cardOptions" placeholder="选项 A&#10;选项 B&#10;选项 C">' + esc(edit && edit.options ? edit.options.join('\n') : '') + '</textarea></div>' +
      '<div class="field"><label>正确项</label><select id="cardAnswerIndex">' + indexOpts + '</select></div></div>' +

      '<div id="fields-judge" class="type-fields"' + fieldsJudge + '>' +
      '<div class="field"><label>判断结果</label><select id="cardCorrect">' +
      '<option value="true"' + (edit && edit.correct === true ? ' selected' : '') + '>正确（√）</option>' +

      '<div id="fields-code" class="type-fields"' + fieldsCode + '>' +
      '<div class="field"><label>题干代码（可选）</label>' +
      '<textarea id="cardPre" placeholder="题干里单独展示的代码">' + esc(edit && edit.pre ? edit.pre : '') + '</textarea></div></div>' +

  function editFilteredCards(deck) {
    var q = (ui.editQuery || '').trim().toLowerCase();
    return (deck.cards || []).filter(function (c) {
      if (ui.editFilter !== 'all' && c.type !== ui.editFilter) return false;
      if (q) {
        var hay = ((c.question || '') + ' ' + (c.answer || '') + ' ' + (c.tag || '') +
          (c.questionImage ? ' 图片题' : '') + (c.answerImage ? ' 图片答案' : '')).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }
  function editListCountText(deck) {
    var all = (deck.cards || []).length;
    var shown = editFilteredCards(deck).length;
    return shown === all ? (all + ' 张') : ('显示 ' + shown + ' / ' + all + ' 张');
  }
  function editListHtml(deck) {
    var all = deck.cards || [];
    var cards = editFilteredCards(deck);
    if (!all.length) return '<div class="empty">还没有卡片。用上面的表单添加第一张。</div>';
    if (!cards.length) return '<div class="empty">没有匹配的卡片，换个关键词或筛选条件。</div>';
    return '<div class="editlist">' + cards.map(function (c) {
      var idx = all.indexOf(c) + 1;
      var ans = String(c.answer || (c.answerImage ? '（图片答案）' : '')).replace(/\s+/g, ' ');
      if (ans.length > 70) ans = ans.slice(0, 70) + '…';
      return '<div class="editrow">' +
        '<span class="num">' + (idx < 10 ? '0' : '') + idx + '</span>' +
        '<div class="body">' + (c.questionImage ? '<div class="thumb">' + imageTag(c.questionImage, '题目图片', 'lib-thumb') + '</div>' : '') +
        '<div class="qq">' + esc(c.question || (c.questionImage ? '（图片题）' : '')) + '</div>' +
        '<div class="mm">' + esc(TYPELABEL[c.type] || c.type) + (c.tag ? ' · ' + esc(c.tag) : '') + ' · ' + esc(ans) + '</div></div>' +
        '<button class="go" data-act="edit-card" data-deck="' + deck.id + '" data-id="' + c.id + '">编辑</button>' +
        '<button class="del" data-act="delete-deck-card" data-deck="' + deck.id + '" data-id="' + c.id + '">删除</button>' +
